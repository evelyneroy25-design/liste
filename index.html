<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfbfd">
<title>Liste</title>

<link rel="apple-touch-icon" href="Image%20ChatGPT%2028%20sept.%202026,%2014_12_55.png">
<link rel="icon" type="image/png" href="Image%20ChatGPT%2028%20sept.%202026,%2014_12_55.png">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#f3f5f8;
}

body{
  min-height:100vh;
}

#listeApp{
  max-width:760px;
  margin:0 auto;
}

.page{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#13213b;
  background:#fbfbfd;
  min-height:100vh;
  padding:16px 13px 30px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:3px 5px 18px;
}

.round,
.small,
.back,
.fab{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.round{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#eef1f5;
  font-size:22px;
}

.back{
  background:none;
  color:#4d88ef;
  font-size:17px;
  padding:5px;
}

.search{
  width:100%;
  border:0;
  background:#eef1f5;
  border-radius:24px;
  padding:13px 18px;
  font-size:17px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

/* GRANDES CARTES */

.swipe{
  position:relative;
  overflow:hidden;
  border-radius:22px;
  touch-action:pan-y;
}

.deleteBehind{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:90px;
  border:0;
  background:#e64b4f;
  color:white;
  font-size:13px;
  font-weight:700;
}

.card{
  position:relative;
  z-index:1;
  width:100%;
  height:130px;
  border:0;
  border-radius:22px;
  padding:14px;
  text-align:left;
  color:#13213b;
  transition:transform .18s ease;
}

.cardMain{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.emoji{
  font-size:32px;
  line-height:1.05;
}

.cardText{
  min-width:0;
  flex:1;
}

.cardTitle{
  font-size:19px;
  font-weight:750;
  line-height:1.08;
  margin-bottom:7px;
}

.cardSubs{
  font-size:13px;
  color:#65748c;
  line-height:1.22;
}

.cardCount{
  position:absolute;
  left:57px;
  bottom:8px;
  font-size:13px;
  color:#65748c;
}

.arrow{
  position:absolute;
  right:12px;
  bottom:2px;
  font-size:28px;
  color:#65748c;
}

/* SOUS-LISTES */

.rowSwipe{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  margin:8px 0;
  touch-action:pan-y;
}

.row{
  position:relative;
  z-index:1;
  background:white;
  border-radius:18px;
  padding:15px 85px 15px 17px;
  min-height:70px;
  box-shadow:0 1px 8px #ccd3dd55;
  transition:transform .18s ease;
}

.rowTitle{
  font-size:18px;
  font-weight:700;
}

.rowMeta{
  color:#718096;
  margin-top:4px;
  font-size:14px;
}

.small{
  background:#eef2f7;
  border-radius:9px;
  padding:7px;
  font-size:15px;
}

.editSub{
  position:absolute;
  right:43px;
  top:18px;
}

.go{
  position:absolute;
  right:14px;
  top:18px;
  font-size:25px;
  color:#65748c;
  border:0;
  background:none;
}

/* ÉLÉMENTS */

.item{
  display:flex;
  align-items:center;
  gap:9px;
  background:white;
  border-radius:16px;
  padding:12px;
  margin:8px 0;
  box-shadow:0 1px 7px #ccd3dd44;
}

.itemText{
  flex:1;
  font-size:17px;
  word-break:break-word;
}

.fab{
  position:sticky;
  bottom:18px;
  display:block;
  margin:20px auto 0;
  width:64px;
  height:64px;
  border-radius:50%;
  background:#4d88ef;
  color:white;
  font-size:38px;
  box-shadow:0 7px 18px #9bb9e8;
  z-index:10;
}

.hint{
  text-align:center;
  color:#8a96a8;
  font-size:12px;
  margin:9px;
}

.empty{
  text-align:center;
  color:#718096;
  padding:50px 10px;
}
</style>
</head>

<body>

<div id="listeApp"></div>

<script>
(function(){

const K="liste-evelyne-ionos-v1";

const seed=[

{
 n:"Voyages",
 e:"🧳",
 c:"#d8edff",
 subs:[
  {n:"Tous mes voyages",items:[]},
  {n:"Prochains voyages",items:[]},
  {n:"Idées destinations",items:[]}
 ]
},

{
 n:"Maison",
 e:"🏡",
 c:"#dcf5e3",
 subs:[
  {n:"Brindas",items:[]},
  {n:"Giens",items:[]},
  {n:"Grigny",items:[]}
 ]
},

{
 n:"Courses",
 e:"🛒",
 c:"#ffe2e9",
 subs:[
  {n:"Alimentaire",items:[]},
  {n:"Maison",items:[]},
  {n:"Cave",items:[]}
 ]
},

{
 n:"À faire",
 e:"📋",
 c:"#fff0b9",
 subs:[
  {n:"To do liste",items:[]},
  {n:"Administratif",items:[]},
  {n:"Projets",items:[]}
 ]
},

{
 n:"Famille",
 e:"👨‍👩‍👧‍👦",
 c:"#e7ddff",
 subs:[
  {n:"Arthur",items:[]},
  {n:"Emy",items:[]},
  {n:"Famille",items:[]}
 ]
},

{
 n:"Culture & loisirs",
 e:"📚",
 c:"#d9edff",
 subs:[
  {n:"Livres",items:[]},
  {n:"Films / séries",items:[]},
  {n:"Sorties",items:[]}
 ]
},

{
 n:"Cave",
 e:"🍷",
 c:"#def3d9",
 subs:[
  {n:"Vins à acheter",items:[]},
  {n:"Dégustations",items:[]},
  {n:"Fournisseurs",items:[]}
 ]
},

{
 n:"Cuisine",
 e:"👩‍🍳",
 c:"#ffe1ec",
 subs:[
  {n:"Recettes",items:[]},
  {n:"Menus",items:[]},
  {n:"Idées",items:[]}
 ]
},

{
 n:"Vacances",
 e:"🏝️",
 c:"#d8f3f5",
 subs:[
  {n:"À ne pas oublier",items:[]},
  {n:"Valise",items:[]},
  {n:"Activités",items:[]}
 ]
},

{
 n:"Idées en vrac",
 e:"💡",
 c:"#ffe8c9",
 subs:[
  {n:"Envies",items:[]},
  {n:"Rencontres",items:[]},
  {n:"Maximes",items:[]}
 ]
}

];

let D;

try{
  D=JSON.parse(localStorage.getItem(K)) || seed;
}catch(e){
  D=seed;
}

let cat=-1;
let sub=-1;

const R=document.getElementById("listeApp");

function save(){
  localStorage.setItem(K,JSON.stringify(D));
}

function h(s){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));
}

function ask(message,value=""){
  return prompt(message,value);
}

function shell(content){
  R.innerHTML='<div class="page">'+content+'</div>';
  setTimeout(activateSwipes,0);
}

/* =========================
   ACCUEIL
========================= */

function home(){

  cat=-1;
  sub=-1;

  let cards=D.map((x,i)=>`

    <div class="swipe">

      <button
        class="deleteBehind"
        onclick="event.stopPropagation();LE.deleteCat(${i})">
        Supprimer
      </button>

      <button
        class="card swipeFront"
        style="background:${x.c}"
        onclick="LE.openCat(${i})">

        <div class="cardMain">

          <span class="emoji">${x.e}</span>

          <div class="cardText">

            <div class="cardTitle">
              ${h(x.n)}
            </div>

            <div class="cardSubs">
              ${x.subs.slice(0,2).map(y=>h(y.n)).join("<br>")}
            </div>

          </div>

        </div>

        <div class="cardCount">
          ${x.subs.length} listes
        </div>

        <div class="arrow">›</div>

      </button>

    </div>

  `).join("");

  shell(`

    <div class="top">

      <span style="font-size:28px">🍋</span>

      <div style="font-size:38px;font-weight:800">
        Liste
      </div>

      <button
        class="round"
        onclick="LE.backup()">
        ⚙️
      </button>

    </div>

    <input
      id="q"
      class="search"
      oninput="LE.search(this.value)"
      placeholder="🔎  Rechercher une liste…">

    <div id="cards" class="grid">
      ${cards}
    </div>

    <div class="hint">
      Glisse une carte vers la gauche pour la supprimer
    </div>

    <button
      class="fab"
      onclick="LE.addCat()">
      +
    </button>

  `);
}

/* =========================
   CATÉGORIE
========================= */

function openCat(i){

  cat=i;
  sub=-1;

  let x=D[i];

  let rows=x.subs.map((y,j)=>`

    <div class="rowSwipe">

      <button
        class="deleteBehind"
        onclick="event.stopPropagation();LE.deleteSub(${j})">
        Supprimer
      </button>

      <div
        class="row swipeFront"
        onclick="LE.openSub(${j})">

        <div class="rowTitle">
          ${h(y.n)}
        </div>

        <div class="rowMeta">
          ${y.items.length} éléments
        </div>

        <button
          class="small editSub"
          onclick="event.stopPropagation();LE.editSub(${j})">
          ✏️
        </button>

        <button class="go">
          ›
        </button>

      </div>

    </div>

  `).join("");

  shell(`

    <button
      class="back"
      onclick="LE.home()">
      ‹ Accueil
    </button>

    <div style="
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px">

      <h2 style="font-size:28px">
        ${x.e} ${h(x.n)}
      </h2>

      <button
        class="small"
        onclick="LE.editCat(${i})">
        ✏️ Modifier
      </button>

    </div>

    ${
      rows ||
      '<div class="empty">Aucune sous-liste.<br>Appuie sur + pour en créer une.</div>'
    }

    <div class="hint">
      Glisse une sous-liste vers la gauche pour la supprimer
    </div>

    <button
      class="fab"
      onclick="LE.addSub()">
      +
    </button>

  `);
}

/* =========================
   CONTENU D'UNE LISTE
========================= */

function openSub(j){

  sub=j;

  let x=D[cat];
  let y=x.subs[j];

  let rows=y.items.map((z,k)=>`

    <div class="item">

      <input
        type="checkbox"
        ${z.d ? "checked" : ""}
        onchange="LE.toggle(${k})"
        style="width:24px;height:24px">

      <div
        class="itemText"
        style="${
          z.d
          ? "text-decoration:line-through;opacity:.5"
          : ""
        }">

        ${h(z.t)}

      </div>

      <button
        class="small"
        onclick="LE.editItem(${k})">
        ✏️
      </button>

      <button
        class="small"
        onclick="LE.deleteItem(${k})">
        🗑️
      </button>

    </div>

  `).join("");

  shell(`

    <button
      class="back"
      onclick="LE.openCat(${cat})">
      ‹ ${h(x.n)}
    </button>

    <div style="
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px">

      <h2 style="font-size:28px">
        ${h(y.n)}
      </h2>

      <button
        class="small"
        onclick="LE.editSub(${j})">
        ✏️ Modifier
      </button>

    </div>

    ${
      rows ||
      '<div class="empty">Cette liste est vide.<br>Appuie sur + pour ajouter.</div>'
    }

    <button
      class="fab"
      onclick="LE.addItem()">
      +
    </button>

  `);
}

/* =========================
   GLISSEMENT IPHONE
========================= */

function activateSwipes(){

  document
    .querySelectorAll(".swipe,.rowSwipe")
    .forEach(wrapper=>{

      let front=wrapper.querySelector(".swipeFront");

      if(!front)return;

      let startX=0;
      let startY=0;
      let moveX=0;

      front.addEventListener(
        "touchstart",
        e=>{

          let t=e.touches[0];

          startX=t.clientX;
          startY=t.clientY;
          moveX=0;

        },
        {passive:true}
      );

      front.addEventListener(
        "touchmove",
        e=>{

          let t=e.touches[0];

          let dx=t.clientX-startX;
          let dy=t.clientY-startY;

          if(Math.abs(dx)>Math.abs(dy)){

            moveX=Math.max(-90,Math.min(0,dx));

            front.style.transition="none";

            front.style.transform=
              "translateX("+moveX+"px)";
          }

        },
        {passive:true}
      );

      front.addEventListener(
        "touchend",
        ()=>{

          front.style.transition=
            "transform .18s ease";

          if(moveX < -40){

            front.style.transform=
              "translateX(-90px)";

          }else{

            front.style.transform=
              "translateX(0)";

          }

        }
      );

    });
}

/* =========================
   ACTIONS
========================= */

window.LE={

  home,
  openCat,
  openSub,

  /* CATÉGORIES */

  addCat(){

    let n=ask("Nom de la catégorie ?");

    if(!n)return;

    let e=
      ask("Choisis un symbole ou emoji :","✨")
      || "✨";

    let colors=[
      "#d8edff",
      "#dcf5e3",
      "#ffe2e9",
      "#fff0b9",
      "#e7ddff",
      "#ffe8c9",
      "#d8f3f5"
    ];

    D.push({
      n:n.trim(),
      e:e,
      c:colors[D.length % colors.length],
      subs:[]
    });

    save();
    home();
  },

  editCat(i){

    let x=D[i];

    let n=
      ask("Nouveau nom de la catégorie :",x.n);

    if(n===null || !n.trim())return;

    let e=
      ask("Emoji ou symbole :",x.e);

    if(e===null)return;

    x.n=n.trim();
    x.e=e.trim() || x.e;

    save();
    openCat(i);
  },

  deleteCat(i){

    let x=D[i];

    if(
      confirm(
        "Supprimer la catégorie « "+
        x.n+
        " » et TOUTES les listes qu'elle contient ?"
      )
    ){

      D.splice(i,1);

      save();
      home();
    }
  },

  /* SOUS-LISTES */

  addSub(){

    let n=ask("Nom de la sous-liste ?");

    if(!n)return;

    D[cat].subs.push({
      n:n.trim(),
      items:[]
    });

    save();
    openCat(cat);
  },

  editSub(j){

    let y=D[cat].subs[j];

    let n=
      ask("Nouveau nom de la sous-liste :",y.n);

    if(n===null || !n.trim())return;

    y.n=n.trim();

    save();

    if(sub===j){
      openSub(j);
    }else{
      openCat(cat);
    }
  },

  deleteSub(j){

    let y=D[cat].subs[j];

    if(
      confirm(
        "Supprimer « "+
        y.n+
        " » et tous les éléments qu'elle contient ?"
      )
    ){

      D[cat].subs.splice(j,1);

      save();
      openCat(cat);
    }
  },

  /* ÉLÉMENTS */

  addItem(){

    let t=ask("Que veux-tu ajouter ?");

    if(!t)return;

    D[cat].subs[sub].items.push({
      t:t.trim(),
      d:false
    });

    save();
    openSub(sub);
  },

  editItem(k){

    let z=D[cat].subs[sub].items[k];

    let t=
      ask("Modifier le texte :",z.t);

    if(t===null || !t.trim())return;

    z.t=t.trim();

    save();
    openSub(sub);
  },

  toggle(k){

    let z=D[cat].subs[sub].items[k];

    z.d=!z.d;

    save();
    openSub(sub);
  },

  deleteItem(k){

    if(confirm("Supprimer cet élément ?")){

      D[cat].subs[sub].items.splice(k,1);

      save();
      openSub(sub);
    }
  },

  /* RECHERCHE */

  search(q){

    q=q.toLowerCase().trim();

    let cards=
      document.querySelectorAll("#cards .swipe");

    cards.forEach((card,i)=>{

      let x=D[i];

      let text=[
        x.n,
        ...x.subs.map(s=>s.n)
      ]
      .join(" ")
      .toLowerCase();

      card.style.display=
        text.includes(q)
        ? ""
        : "none";

    });
  },

  /* SAUVEGARDE */

  backup(){

    let a=document.createElement("a");

    let blob=
      new Blob(
        [JSON.stringify(D,null,2)],
        {type:"application/json"}
      );

    a.href=
      URL.createObjectURL(blob);

    a.download=
      "sauvegarde-liste.json";

    a.click();

    setTimeout(
      ()=>URL.revokeObjectURL(a.href),
      1000
    );
  }

};

home();

})();
</script>

</body>
</html>
